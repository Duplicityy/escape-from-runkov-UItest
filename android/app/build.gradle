plugins {
    id 'com.android.application'
}

android {
    namespace 'com.duplicityy.runkov'
    compileSdk 35

    defaultConfig {
        applicationId 'com.duplicityy.runkov'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    // Point directly at the finished web build: avoid another multi-gigabyte
    // source copy. APK asset compression remains enabled for the GLB models.
    sourceSets {
        main.assets.srcDirs = [file('../../dist')]
    }
}

tasks.register('verifyWebBundle') {
    doLast {
        if (!file('../../dist/index.html').isFile()) {
            throw new GradleException('Build the game first with npm run build from the repository root.')
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn 'verifyWebBundle'
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
