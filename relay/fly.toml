# fly.toml app configuration file generated for escape-from-runkov-relay on 2026-11-03T15:46:57-06:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'escape-from-runkov-relay'
primary_region = 'dfw'

[build]
  dockerfile = 'Dockerfile'

[env]
  MULTIPLAYER_ANY_MAP = 'on'
  MULTIPLAYER_METRICS = 'off'
  PORT = '8787'
  PROXY = 'local'

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 800
    soft_limit = 600

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
